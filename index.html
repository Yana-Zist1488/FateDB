<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<meta name="theme-color" content="#0f1115" />
<title>Fate Servants DB</title>
<link rel="manifest" href="manifest.json" />
<style>
  /* ---------- Базовые переменные и тёмная тема по умолчанию ---------- */
  :root {
    --bg: #0f1115;
    --surface: #171a21;
    --surface-2: #1f232c;
    --border: #2a2f3a;
    --text: #e6e8ee;
    --muted: #9aa3b2;
    --accent: #c9a227;       /* "золото" Fate (настраивается) */
    --accent-2: #7c5cff;     /* классовые навыки (настраивается) */
    --danger: #e05252;
    --ok: #3fbf7f;           /* личные навыки (настраивается) */
    --radius: 14px;
    --shadow: 0 4px 14px rgba(0,0,0,.35);
    --tap: 44px;
    font-size: 16px;
  }
  :root.light {
    --bg: #f5f6f8;
    --surface: #ffffff;
    --surface-2: #eef0f4;
    --border: #d6dae1;
    --text: #1a1d23;
    --muted: #5b6472;
    --shadow: 0 4px 14px rgba(0,0,0,.08);
  }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body { height: 100%; }
  body {
    margin: 0;
    background: var(--bg);
    color: var(--text);
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
    display: flex;
    flex-direction: column;
    overflow: hidden;
  }

  /* ---------- Топбар ---------- */
  header.topbar {
    display: flex; align-items: center; gap: 8px;
    padding: 10px 12px calc(10px + env(safe-area-inset-top, 0)) 12px;
    background: var(--surface);
    border-bottom: 1px solid var(--border);
    flex: 0 0 auto;
    z-index: 10;
  }
  header.topbar h1 {
    font-size: 1.05rem; margin: 0; font-weight: 700; letter-spacing: .3px;
    white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
  }
  header.topbar .spacer { flex: 1; }

  /* ---------- Кнопки ---------- */
  button, .btn {
    min-height: var(--tap);
    padding: 0 14px;
    border-radius: var(--radius);
    border: 1px solid var(--border);
    background: var(--surface-2);
    color: var(--text);
    font-size: .95rem;
    font-weight: 600;
    cursor: pointer;
    display: inline-flex; align-items: center; justify-content: center; gap: 6px;
    transition: transform .05s ease, background .15s ease, border-color .15s;
  }
  button:active { transform: scale(.97); }
  .btn-primary { background: var(--accent); color: #1a1405; border-color: transparent; }
  .btn-danger  { background: transparent; color: var(--danger); border-color: var(--danger); }
  .btn-ghost   { background: transparent; }
  .btn-icon    { width: var(--tap); padding: 0; font-size: 1.4rem; }
  .fab {
    position: fixed;
    right: 16px;
    bottom: calc(16px + env(safe-area-inset-bottom, 0));
    width: 60px; height: 60px;
    border-radius: 50%;
    background: var(--accent);
    color: #1a1405;
    font-size: 2rem; font-weight: 700;
    border: none;
    box-shadow: var(--shadow);
    z-index: 50;
    display: flex; align-items: center; justify-content: center;
  }

  /* ---------- Контейнер экранов ---------- */
  main {
    flex: 1 1 auto;
    overflow-y: auto;
    -webkit-overflow-scrolling: touch;
    padding: 12px 12px calc(90px + env(safe-area-inset-bottom, 0));
    display: flex; flex-direction: column; gap: 12px;
  }
  .screen { display: none; flex-direction: column; gap: 12px; }
  .screen.active { display: flex; }

  /* ---------- Поиск и фильтры ---------- */
  .searchbar { display: flex; gap: 8px; }
  .searchbar input { flex: 1; }
  .filters { display: flex; gap: 8px; flex-wrap: wrap; }
  .filters select { flex: 1 1 100px; font-size: 0.85rem; padding: 8px; }

  /* ---------- Поля ввода ---------- */
  input[type=text], input[type=search], textarea, select {
    width: 100%;
    min-height: var(--tap);
    padding: 10px 12px;
    background: var(--surface-2);
    color: var(--text);
    border: 1px solid var(--border);
    border-radius: var(--radius);
    font-size: 1rem;
    font-family: inherit;
    outline: none;
  }
  textarea { min-height: 100px; resize: vertical; line-height: 1.4; }
  input:focus, textarea:focus, select:focus { border-color: var(--accent-2); }
  label.field { display: flex; flex-direction: column; gap: 6px; font-size: .82rem; color: var(--muted); font-weight: 600; }
  label.field > span.req::after { content: " *"; color: var(--danger); }

  /* ---------- Карточки слуг ---------- */
  .list { display: flex; flex-direction: column; gap: 10px; }
  .card {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: var(--radius);
    padding: 12px 14px;
    display: flex; gap: 12px; align-items: center;
    cursor: pointer;
    box-shadow: var(--shadow);
  }
  .card:active { transform: scale(.99); }
  .badge {
    display: inline-flex; align-items: center; justify-content: center;
    padding: 6px 10px;
    background: var(--surface-2);
    border: 1px solid var(--border);
    border-radius: 999px;
    font-size: .75rem; font-weight: 700;
    white-space: nowrap;
  }
  .badge.class { background: rgba(201,162,39,.15); border-color: var(--accent); color: var(--accent); }
  .badge.kind-class { background: rgba(124,92,255,.18); border-color: var(--accent-2); color: var(--accent-2); }
  .badge.kind-personal { background: rgba(63,191,127,.15); border-color: var(--ok); color: var(--ok); }
  .card .avatar {
    width: 48px; height: 48px; border-radius: 12px;
    background: linear-gradient(135deg, var(--accent), var(--accent-2));
    display: flex; align-items: center; justify-content: center;
    font-weight: 800; color: #111; font-size: 1.1rem; flex: 0 0 auto;
  }
  .card .meta { flex: 1; min-width: 0; }
  .card .meta h3 { margin: 0 0 4px; font-size: 1rem; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .card .meta .sub { color: var(--muted); font-size: .8rem; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .empty { text-align: center; color: var(--muted); padding: 40px 20px; }

  /* ---------- Детали слуги ---------- */
  .detail-section { background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius); padding: 14px; }
  .detail-section h3 { margin: 0 0 10px; font-size: .85rem; text-transform: uppercase; letter-spacing: .8px; color: var(--accent); }
  .detail-section p { margin: 0 0 10px; line-height: 1.5; white-space: pre-wrap; }
  .detail-section p:last-child { margin-bottom: 0; }
  .kv { display: flex; gap: 8px; margin-bottom: 8px; font-size: .9rem; }
  .kv b { color: var(--muted); font-weight: 600; min-width: 90px; }
  .chips { display: flex; flex-wrap: wrap; gap: 6px; }
  .params-grid { display: grid; grid-template-columns: repeat(2, 1fr); gap: 8px; }
  .param { background: var(--surface-2); border-radius: 10px; padding: 8px 10px; }
  .param .name { font-size: .72rem; color: var(--muted); text-transform: uppercase; letter-spacing: .5px; }
  .param .val { font-size: 1.1rem; font-weight: 700; }
  .param .alt { font-size: .75rem; color: var(--accent); }
  .skill-item, .np-item { padding: 10px 0; border-bottom: 1px dashed var(--border); }
  .skill-item:last-child, .np-item:last-child { border-bottom: none; }
  .skill-head, .np-head { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; margin-bottom: 4px; }
  .skill-head .name, .np-head .name { font-weight: 700; }
  .detail-actions { display: flex; gap: 8px; }
  .detail-actions .btn { flex: 1; }

  /* ---------- Аккордеон (сворачиваемые секции) ---------- */
  .accordion { padding: 0 !important; overflow: hidden; }
  .accordion summary {
    padding: 14px; cursor: pointer; display: flex; align-items: center; justify-content: space-between;
    user-select: none; list-style: none; background: var(--surface); transition: background 0.2s;
  }
  .accordion summary::-webkit-details-marker { display: none; }
  .accordion summary:hover { background: var(--surface-2); }
  .accordion summary::after {
    content: "▼"; font-size: 0.8rem; color: var(--accent);
    transition: transform 0.2s ease; margin-left: 10px;
  }
  .accordion[open] summary::after { transform: rotate(180deg); }
  .accordion summary h3 { margin: 0; }
  .accordion-content {
    padding: 0 14px 14px 14px; border-top: 1px solid var(--border);
    margin-top: 0; padding-top: 10px;
  }
  .accordion-content p { margin: 0; line-height: 1.5; white-space: pre-wrap; }

  /* ---------- Форма ---------- */
  form { display: flex; flex-direction: column; gap: 14px; }
  fieldset {
    border: 1px solid var(--border); border-radius: var(--radius);
    padding: 14px; margin: 0; background: var(--surface);
  }
  legend {
    padding: 0 6px; font-size: .8rem; font-weight: 700; text-transform: uppercase; letter-spacing: .8px; color: var(--accent);
  }
  .form-row { display: flex; gap: 8px; flex-wrap: wrap; }
  .form-row > * { flex: 1 1 160px; min-width: 0; }
  .param-row { display: flex; gap: 8px; align-items: flex-end; }
  .param-row .field { flex: 1; }
  .param-row .toggle { flex: 0 0 auto; display: flex; flex-direction: column; align-items: center; gap: 4px; font-size: .7rem; color: var(--muted); }
  .switch { position: relative; width: 44px; height: 26px; }
  .switch input { opacity: 0; width: 0; height: 0; }
  .switch .slider {
    position: absolute; inset: 0; background: var(--surface-2);
    border: 1px solid var(--border); border-radius: 999px; transition: .2s;
  }
  .switch .slider::before {
    content: ""; position: absolute; width: 18px; height: 18px; left: 3px; top: 3px;
    background: var(--muted); border-radius: 50%; transition: .2s;
  }
  .switch input:checked + .slider { background: var(--accent-2); border-color: var(--accent-2); }
  .switch input:checked + .slider::before { transform: translateX(18px); background: #fff; }
  .dyn-item {
    border: 1px solid var(--border); border-radius: 12px; padding: 10px;
    display: flex; flex-direction: column; gap: 8px; background: var(--surface-2);
  }
  .dyn-item .head { display: flex; gap: 8px; align-items: center; }
  .dyn-item .head .spacer { flex: 1; }
  .form-actions { display: flex; gap: 8px; flex-wrap: wrap; }
  .form-actions .btn { flex: 1 1 120px; }
  .hint { font-size: .75rem; color: var(--muted); }
  .hidden { display: none !important; }

  /* ---------- Модалки и тосты ---------- */
  #toast {
    position: fixed; left: 50%; bottom: calc(90px + env(safe-area-inset-bottom,0));
    transform: translateX(-50%) translateY(20px);
    background: var(--surface-2); border: 1px solid var(--border);
    color: var(--text); padding: 10px 16px; border-radius: 999px;
    font-size: .85rem; opacity: 0; pointer-events: none; transition: .25s; z-index: 100;
    box-shadow: var(--shadow); max-width: 90vw; text-align: center;
  }
  #toast.show { opacity: 1; transform: translateX(-50%) translateY(0); }

  #modal, #classModal, #colorModal {
    position: fixed; inset: 0; background: rgba(0,0,0,.6);
    display: none; align-items: center; justify-content: center; z-index: 200; padding: 20px;
  }
  .box {
    background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius);
    padding: 20px; max-width: 420px; width: 100%; box-shadow: var(--shadow);
    display: flex; flex-direction: column; gap: 14px; max-height: 90vh; overflow-y: auto;
  }
  .box p { margin: 0; line-height: 1.5; }
  .box .actions { display: flex; gap: 8px; }
  .box .actions .btn { flex: 1; }

  /* ---------- Десктоп ---------- */
  @media (min-width: 720px) {
    main { padding: 20px 24px 100px; max-width: 900px; margin: 0 auto; width: 100%; }
    .list { display: grid; grid-template-columns: repeat(2, 1fr); gap: 12px; }
    .form-row > * { flex: 1 1 200px; }
    .fab { right: calc(50% - 430px); }
  }
  @media (min-width: 1100px) {
    .list { grid-template-columns: repeat(3, 1fr); }
  }
</style>
</head>
<body>

<header class="topbar">
  <h1 id="appTitle">Fate Servants DB</h1>
  <div class="spacer"></div>
  <button class="btn-icon btn-ghost" id="colorBtn" title="Настройка цветов" aria-label="Настройка цветов">🎨</button>
  <button class="btn-icon btn-ghost" id="themeBtn" title="Светлая/тёмная тема" aria-label="Сменить тему">◐</button>
</header>

<main>
  <!-- ===================== ГЛАВНЫЙ ЭКРАН ===================== -->
  <section class="screen active" id="screen-list">
    <div class="searchbar">
      <input type="search" id="searchInput" placeholder="Поиск: имя, теги, навык, NP…" autocomplete="off" inputmode="search" />
    </div>
    <div class="filters">
      <select id="filterClass"><option value="">Все классы</option></select>
      <select id="filterSource"><option value="">Все источники</option></select>
      <select id="filterTag"><option value="">Все теги</option></select>
    </div>
    <div class="list" id="servantList"></div>
    <div class="empty hidden" id="emptyState">
      База пуста. Нажмите «+», чтобы добавить первого слугу.
    </div>
    <div class="form-actions" style="margin-top: 10px;">
      <button class="btn btn-ghost" id="topExport">⤓ Экспорт JSON</button>
      <button class="btn btn-ghost" id="topImport">⤒ Импорт JSON</button>
    </div>
    <input type="file" id="topImportFile" accept="application/json,.json" class="hidden" />
  </section>

  <!-- ===================== ЭКРАН ДЕТАЛЕЙ ===================== -->
  <section class="screen" id="screen-detail"></section>

  <!-- ===================== ЭКРАН ФОРМЫ ===================== -->
  <section class="screen" id="screen-form"></section>
</main>

<button class="fab hidden" id="fabAdd" title="Добавить слугу" aria-label="Добавить слугу">+</button>
<div id="toast" role="status" aria-live="polite"></div>

<!-- Модалка подтверждения -->
<div id="modal">
  <div class="box">
    <p id="modalText"></p>
    <div class="actions">
      <button class="btn btn-ghost" id="modalCancel">Отмена</button>
      <button class="btn btn-primary" id="modalOk">ОК</button>
    </div>
  </div>
</div>

<!-- Модалка описания классов -->
<div id="classModal">
  <div class="box">
    <h3 id="classModalTitle" style="margin: 0; color: var(--accent); font-size: 1.1rem;">Класс</h3>
    <div id="classModalDesc" style="line-height: 1.5; white-space: pre-wrap; font-size: 0.95rem;"></div>
    
    <!-- Поле для редактирования описания (показываем только для кастомных классов) -->
    <div id="classModalEditWrap" class="hidden" style="display: flex; flex-direction: column; gap: 6px;">
      <label class="field">
        <span>Описание этого класса (сохраняется в браузере)</span>
        <textarea id="classModalEdit" rows="4"></textarea>
      </label>
      <button class="btn btn-ghost" id="classModalSave" style="align-self: flex-end;">Сохранить описание</button>
    </div>
    
    <button class="btn btn-primary" id="classModalClose">Закрыть</button>
  </div>
</div>

<!-- Модалка настройки цветов -->
<div id="colorModal">
  <div class="box">
    <h3 style="margin: 0; color: var(--accent);">Настройка цветов</h3>
    
    <div style="display: flex; flex-direction: column; gap: 8px;">
      <div style="font-size: 0.85rem; color: var(--muted); font-weight: 600;">Главный акцент (заголовки, рамки)</div>
      <div style="display: flex; gap: 8px; flex-wrap: wrap; align-items: center;">
        <input type="color" id="colorAccent" value="#c9a227" style="width: 40px; height: 40px; padding: 0; border: none; background: transparent; cursor: pointer; border-radius: 8px; overflow: hidden;">
        <button class="btn btn-ghost btn-sm" data-target="--accent" data-color="#c9a227" style="padding: 4px 8px; min-height: 32px; font-size: 0.8rem;">Золото</button>
        <button class="btn btn-ghost btn-sm" data-target="--accent" data-color="#4da6ff" style="padding: 4px 8px; min-height: 32px; font-size: 0.8rem;">Синий</button>
        <button class="btn btn-ghost btn-sm" data-target="--accent" data-color="#e05252" style="padding: 4px 8px; min-height: 32px; font-size: 0.8rem;">Красный</button>
      </div>
    </div>

    <div style="display: flex; flex-direction: column; gap: 8px;">
      <div style="font-size: 0.85rem; color: var(--muted); font-weight: 600;">Классовые навыки</div>
      <div style="display: flex; gap: 8px; flex-wrap: wrap; align-items: center;">
        <input type="color" id="colorClassSkill" value="#7c5cff" style="width: 40px; height: 40px; padding: 0; border: none; background: transparent; cursor: pointer; border-radius: 8px; overflow: hidden;">
        <button class="btn btn-ghost btn-sm" data-target="--accent-2" data-color="#7c5cff" style="padding: 4px 8px; min-height: 32px; font-size: 0.8rem;">Фиолет</button>
        <button class="btn btn-ghost btn-sm" data-target="--accent-2" data-color="#e0a800" style="padding: 4px 8px; min-height: 32px; font-size: 0.8rem;">Золото</button>
      </div>
    </div>

    <div style="display: flex; flex-direction: column; gap: 8px;">
      <div style="font-size: 0.85rem; color: var(--muted); font-weight: 600;">Личные навыки</div>
      <div style="display: flex; gap: 8px; flex-wrap: wrap; align-items: center;">
        <input type="color" id="colorPersonalSkill" value="#3fbf7f" style="width: 40px; height: 40px; padding: 0; border: none; background: transparent; cursor: pointer; border-radius: 8px; overflow: hidden;">
        <button class="btn btn-ghost btn-sm" data-target="--ok" data-color="#3fbf7f" style="padding: 4px 8px; min-height: 32px; font-size: 0.8rem;">Зеленый</button>
        <button class="btn btn-ghost btn-sm" data-target="--ok" data-color="#00bcd4" style="padding: 4px 8px; min-height: 32px; font-size: 0.8rem;">Бирюза</button>
      </div>
    </div>

    <button class="btn btn-primary" id="colorModalClose" style="margin-top: 10px;">Закрыть</button>
  </div>
</div>

<script>
/* ============================================================================
   Fate Servants DB — одностраничное PWA без фреймворков.
   ========================================================================== */

/* -------------------------- Константы -------------------------- */
const DB_NAME = 'fate_servants_db';
const DB_VERSION = 1;
const STORE = 'servants';
const DRAFT_KEY = 'fate_servant_draft';
const STANDARD_CLASSES = ['Сейбер', 'Арчер', 'Лансер', 'Райдер', 'Кастер', 'Ассасин', 'Берсеркер'];
const EXTRA_CLASS_LABEL = 'Экстра-класс';
const PARAM_KEYS = [
  ['strength', 'Сила'],
  ['endurance', 'Выносливость'],
  ['agility', 'Ловкость'],
  ['mana', 'Мана'],
  ['luck', 'Удача'],
  ['np', 'NP'],
];

/* -------------------------- Описания классов -------------------------- */
const CLASS_DESCRIPTIONS = {
  'Сейбер': 'Мечники, делающие ставку на честный ближний бой и высочайшие показатели атаки и защиты. Обычно это герои с легендарными клинками и сильной волей, часто выступающие как «лицо» франшизы.',
  'Арчер': 'Дальнобойные бойцы, чья сила — в точности и дистанции, а не в лобовой схватке. Класс известен исключительным набором навыков и боевого опыта, а не только луком — многие его представители бьют чем угодно, лишь бы издалека.',
  'Лансер': 'Копейщики, мастера быстрых, точных и агрессивных атак на средней дистанции. Их стиль — скорость, манёвренность и контроль дистанции, но в сюжете им традиционно «не везёт».',
  'Райдер': 'Всадники, чья мощь проявляется через верховых животных, транспорт и благородные фамильяры. Это самый универсальный класс: они сильны и в бою, и в мобильности, и в поддержке.',
  'Кастер': 'Маги и чародеи, полагающиеся на заклинания, ритуалы и подготовку, а не на грубую силу. В прямом бою слабы, но в обороне, поддержке и хитроумных схемах могут быть смертельно опасны.',
  'Ассасин': 'Скрытные убийцы, специализирующиеся на неожиданных ударах, ядах и ликвидации цели. Их сила — в скрытности и летальности одного точного удара, а не в открытом противостоянии.',
  'Берсеркер': 'Безумные воины, жертвующие рассудком ради колоссальной физической мощи и ярости. Опасны в лоб, но плохо контролируемы и уязвимы к тактике.'
};

/* -------------------------- Утилиты -------------------------- */
const $ = (sel, root = document) => root.querySelector(sel);
const $$ = (sel, root = document) => Array.from(root.querySelectorAll(sel));
const genId = () => 's_' + Date.now().toString(36) + '_' + Math.random().toString(36).slice(2, 9);
const esc = (s) => String(s == null ? '' : s)
  .replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;')
  .replace(/"/g, '&quot;').replace(/'/g, '&#39;');

function toast(msg, ms = 2200) {
  const el = $('#toast');
  el.textContent = msg;
  el.classList.add('show');
  clearTimeout(el._t);
  el._t = setTimeout(() => el.classList.remove('show'), ms);
}

let modalResolver = null;
function confirmDialog(text, okLabel = 'ОК') {
  return new Promise((resolve) => {
    modalResolver = resolve;
    $('#modalText').textContent = text;
    $('#modalOk').textContent = okLabel;
    $('#modal').classList.add('show');
  });
}

/* -------------------------- Модалка цветов -------------------------- */
function initColorSettings() {
  const colorBtn = $('#colorBtn');
  const colorModal = $('#colorModal');
  if (!colorBtn || !colorModal) return;

  const applyColors = () => {
    const settings = JSON.parse(localStorage.getItem('color_settings') || '{}');
    if (settings.accent) document.documentElement.style.setProperty('--accent', settings.accent);
    if (settings.accent2) document.documentElement.style.setProperty('--accent-2', settings.accent2);
    if (settings.ok) document.documentElement.style.setProperty('--ok', settings.ok);
    
    if (settings.accent) $('#colorAccent').value = settings.accent;
    if (settings.accent2) $('#colorClassSkill').value = settings.accent2;
    if (settings.ok) $('#colorPersonalSkill').value = settings.ok;
  };
  applyColors();

  const saveColors = () => {
    const settings = {
      accent: $('#colorAccent').value,
      accent2: $('#colorClassSkill').value,
      ok: $('#colorPersonalSkill').value,
    };
    localStorage.setItem('color_settings', JSON.stringify(settings));
    applyColors();
  };

  colorBtn.addEventListener('click', () => colorModal.style.display = 'flex');
  $('#colorModalClose').addEventListener('click', () => colorModal.style.display = 'none');
  colorModal.addEventListener('click', (e) => {
    if (e.target === colorModal) colorModal.style.display = 'none';
  });

  $('#colorAccent').addEventListener('input', saveColors);
  $('#colorClassSkill').addEventListener('input', saveColors);
  $('#colorPersonalSkill').addEventListener('input', saveColors);

  colorModal.querySelectorAll('[data-target]').forEach(btn => {
    btn.addEventListener('click', () => {
      const targetVar = btn.dataset.target;
      const color = btn.dataset.color;
      
      if (targetVar === '--accent') $('#colorAccent').value = color;
      if (targetVar === '--accent-2') $('#colorClassSkill').value = color;
      if (targetVar === '--ok') $('#colorPersonalSkill').value = color;
      
      saveColors();
    });
  });
}

/* -------------------------- IndexedDB -------------------------- */
let dbPromise = null;
function openDB() {
  if (dbPromise) return dbPromise;
  dbPromise = new Promise((resolve, reject) => {
    const req = indexedDB.open(DB_NAME, DB_VERSION);
    req.onupgradeneeded = () => {
      const db = req.result;
      if (!db.objectStoreNames.contains(STORE)) {
        const store = db.createObjectStore(STORE, { keyPath: 'id' });
        store.createIndex('name', 'name', { unique: false });
        store.createIndex('class', 'class', { unique: false });
        store.createIndex('source', 'source', { unique: false });
      }
    };
    req.onsuccess = () => resolve(req.result);
    req.onerror = () => reject(req.error);
  });
  return dbPromise;
}

async function dbGetAll() {
  const db = await openDB();
  return new Promise((resolve, reject) => {
    const tx = db.transaction(STORE, 'readonly');
    const req = tx.objectStore(STORE).getAll();
    req.onsuccess = () => resolve(req.result);
    req.onerror = () => reject(req.error);
  });
}
async function dbGet(id) {
  const db = await openDB();
  return new Promise((resolve, reject) => {
    const req = db.transaction(STORE, 'readonly').objectStore(STORE).get(id);
    req.onsuccess = () => resolve(req.result || null);
    req.onerror = () => reject(req.error);
  });
}
async function dbPut(servant) {
  const db = await openDB();
  return new Promise((resolve, reject) => {
    const tx = db.transaction(STORE, 'readwrite');
    tx.objectStore(STORE).put(servant);
    tx.oncomplete = () => resolve();
    tx.onerror = () => reject(tx.error);
  });
}
async function dbDelete(id) {
  const db = await openDB();
  return new Promise((resolve, reject) => {
    const tx = db.transaction(STORE, 'readwrite');
    tx.objectStore(STORE).delete(id);
    tx.oncomplete = () => resolve();
    tx.onerror = () => reject(tx.error);
  });
}
async function dbClear() {
  const db = await openDB();
  return new Promise((resolve, reject) => {
    const tx = db.transaction(STORE, 'readwrite');
    tx.objectStore(STORE).clear();
    tx.oncomplete = () => resolve();
    tx.onerror = () => reject(tx.error);
  });
}
async function dbBulkPut(items) {
  const db = await openDB();
  return new Promise((resolve, reject) => {
    const tx = db.transaction(STORE, 'readwrite');
    const store = tx.objectStore(STORE);
    items.forEach((it) => store.put(it));
    tx.oncomplete = () => resolve();
    tx.onerror = () => reject(tx.error);
  });
}

/* -------------------------- Модель / нормализация -------------------------- */
function emptyServant() {
  const params = {};
  PARAM_KEYS.forEach(([k]) => { params[k] = { base: '', alt: null }; });
  return {
    id: genId(),
    name: '',
    aliases: [],
    tags: [], // <-- ДОБАВЛЕНО
    class: '',
    alignment: [],
    natural_enemy: [],
    source: '',
    appearance: '',
    biography: '',
    parameters: params,
    skills: [],
    noble_phantasms: [],
    notes: '',
  };
}

function normalizeServant(raw) {
  const s = emptyServant();
  if (!raw || typeof raw !== 'object') return s;
  s.id = typeof raw.id === 'string' && raw.id ? raw.id : genId();
  s.name = String(raw.name || '').trim();
  s.aliases = Array.isArray(raw.aliases) ? raw.aliases.map(String).filter(Boolean) : [];
  s.tags = Array.isArray(raw.tags) ? raw.tags.map(String).filter(Boolean) : []; // <-- ДОБАВЛЕНО
  s.class = String(raw.class || '');
  s.alignment = Array.isArray(raw.alignment) ? raw.alignment.map(String).filter(Boolean) : [];
  s.natural_enemy = Array.isArray(raw.natural_enemy) ? raw.natural_enemy.map(String).filter(Boolean) : [];
  s.source = String(raw.source || '');
  s.appearance = String(raw.appearance || '');
  s.biography = String(raw.biography || '');
  s.notes = String(raw.notes || '');
  const p = raw.parameters || {};
  PARAM_KEYS.forEach(([k]) => {
    const v = p[k] || {};
    s.parameters[k] = {
      base: String(v.base || ''),
      alt: v.alt == null || v.alt === '' ? null : String(v.alt),
    };
  });
  s.skills = Array.isArray(raw.skills)
    ? raw.skills.map((sk) => ({
        kind: sk.kind === 'personal' ? 'personal' : 'class',
        name: String(sk.name || ''),
        rank: String(sk.rank || ''),
        description: String(sk.description || ''),
      }))
    : [];
  s.noble_phantasms = Array.isArray(raw.noble_phantasms)
    ? raw.noble_phantasms.map((np) => ({
        label: String(np.label || ''),
        name_ru: String(np.name_ru || ''),
        name_original: String(np.name_original || ''),
        type: String(np.type || ''),
        rank: String(np.rank || ''),
        effect: String(np.effect || ''),
      }))
    : [];
  return s;
}

function matchesQuery(s, q) {
  if (!q) return true;
  const needle = q.toLowerCase();
  const hay = [
    s.name,
    ...(s.aliases || []),
    ...(s.tags || []), // <-- ДОБАВЛЕНО
    s.class,
    s.source,
    s.biography,
    s.appearance,
    s.notes,
    ...(s.skills || []).flatMap((k) => [k.name, k.rank, k.description]),
    ...(s.noble_phantasms || []).flatMap((n) => [n.label, n.name_ru, n.name_original, n.type, n.rank, n.effect]),
  ].join('\n').toLowerCase();
  return hay.includes(needle);
}

/* -------------------------- Главный экран -------------------------- */
async function refreshAll() {
  state.all = await dbGetAll();
  state.all.sort((a, b) => a.name.localeCompare(b.name, 'ru'));
}

function fillFilters() {
  const extra = new Set();
  state.all.forEach((s) => {
    if (s.class && !STANDARD_CLASSES.includes(s.class)) extra.add(s.class);
  });
  const classSel = $('#filterClass');
  const prev = classSel.value;
  classSel.innerHTML = '<option value="">Все классы</option>';
  STANDARD_CLASSES.forEach((c) => {
    classSel.insertAdjacentHTML('beforeend', `<option value="${esc(c)}">${esc(c)}</option>`);
  });
  Array.from(extra).sort((a, b) => a.localeCompare(b, 'ru')).forEach((c) => {
    classSel.insertAdjacentHTML('beforeend', `<option value="${esc(c)}">${esc(c)} (экстра)</option>`);
  });
  classSel.value = prev && Array.from(classSel.options).some((o) => o.value === prev) ? prev : '';

  const sources = Array.from(new Set(state.all.map((s) => s.source).filter(Boolean)))
    .sort((a, b) => a.localeCompare(b, 'ru'));
  const srcSel = $('#filterSource');
  const prevSrc = srcSel.value;
  srcSel.innerHTML = '<option value="">Все источники</option>';
  sources.forEach((src) => {
    srcSel.insertAdjacentHTML('beforeend', `<option value="${esc(src)}">${esc(src)}</option>`);
  });
  srcSel.value = sources.includes(prevSrc) ? prevSrc : '';

  // Теги
  const allTags = new Set();
  state.all.forEach((s) => {
    if (s.tags) s.tags.forEach((t) => allTags.add(t));
  });
  const tagSel = $('#filterTag');
  const prevTag = tagSel.value;
  tagSel.innerHTML = '<option value="">Все теги</option>';
  Array.from(allTags).sort((a, b) => a.localeCompare(b, 'ru')).forEach((t) => {
    tagSel.insertAdjacentHTML('beforeend', `<option value="${esc(t)}">${esc(t)}</option>`);
  });
  tagSel.value = allTags.has(prevTag) ? prevTag : '';
}

function renderList() {
  const q = $('#searchInput').value.trim();
  const fClass = $('#filterClass').value;
  const fSource = $('#filterSource').value;
  const fTag = $('#filterTag').value;

  const filtered = state.all.filter((s) => {
    if (fClass && s.class !== fClass) return false;
    if (fSource && s.source !== fSource) return false;
    if (fTag && (!s.tags || !s.tags.includes(fTag))) return false;
    return matchesQuery(s, q);
  });

  const list = $('#servantList');
  list.innerHTML = '';
  const empty = $('#emptyState');
  if (filtered.length === 0) {
    empty.classList.remove('hidden');
    empty.textContent = state.all.length === 0
      ? 'База пуста. Нажмите «+», чтобы добавить первого слугу.'
      : 'Ничего не найдено.';
    return;
  }
  empty.classList.add('hidden');

  const frag = document.createDocumentFragment();
  filtered.forEach((s) => {
    const card = document.createElement('div');
    card.className = 'card';
    card.dataset.id = s.id;
    const initial = (s.name || '?').trim().charAt(0).toUpperCase();
    const subParts = [s.class, s.source].filter(Boolean).join(' · ');
    card.innerHTML = `
      <div class="avatar">${esc(initial)}</div>
      <div class="meta">
        <h3>${esc(s.name || '(без имени)')}</h3>
        <div class="sub">${esc(subParts || '—')}</div>
      </div>
      <span class="badge class">${esc(s.class || '—')}</span>
    `;
    card.addEventListener('click', () => openDetail(s.id));
    frag.appendChild(card);
  });
  list.appendChild(frag);
}

/* -------------------------- Форма -------------------------- */
function openForm(existing) {
  state.formData = existing ? normalizeServant(existing) : emptyServant();
  state.currentId = existing ? existing.id : null;
  renderForm();
  showScreen('form', state.formData.name);
  setTimeout(maybeOfferDraft, 50);
}

function saveDraft() {
  if (!state.formData) return;
  try {
    localStorage.setItem(DRAFT_KEY, JSON.stringify({
      savedAt: Date.now(),
      data: state.formData,
    }));
  } catch (e) { /* квота — молча игнорируем */ }
}
function clearDraft() {
  localStorage.removeItem(DRAFT_KEY);
}
async function maybeOfferDraft() {
  if (state.draftChecked) return;
  state.draftChecked = true;
  const raw = localStorage.getItem(DRAFT_KEY);
  if (!raw) return;
  let parsed;
  try { parsed = JSON.parse(raw); } catch (e) { clearDraft(); return; }
  if (!parsed || !parsed.data) { clearDraft(); return; }
  const when = new Date(parsed.savedAt).toLocaleString('ru');
  const ok = await confirmDialog(
    `Найден несохранённый черновик от ${when}. Восстановить его? (Текущие введённые данные будут заменены.)`,
    'Восстановить'
  );
  if (ok) {
    state.formData = normalizeServant(parsed.data);
    renderForm();
    toast('Черновик восстановлен');
  } else {
    clearDraft();
  }
}

  // Навыки (название -> тип/ранг -> описание)
  const skillsHtml = d.skills.map((sk, i) => `

          </select>
        </label>

          <span>Ранг</span>
          <input type="text" data-skill-rank="${i}" value="${esc(sk.rank)}" placeholder="A / B+ / EX" />

  `).join('');

  // NP (название -> метка/ранг -> тип -> эффект)
  const npHtml = d.noble_phantasms.map((np, i) => `
    <div class="dyn-item" data-np-index="${i}">
      <div class="head">
        <span style="font-weight:700;color:var(--muted);font-size:.8rem;">NP #${i + 1}</span>
        <div class="spacer"></div>
        <button type="button" class="btn btn-danger btn-icon" data-np-remove="${i}" title="Удалить">✕</button>
      </div>

      <label class="field">
        <span>Название (рус)</span>
        <input type="text" data-np-name-ru="${i}" value="${esc(np.name_ru)}" />
      </label>
      <label class="field">
        <span>Название (оригинал)</span>
        <input type="text" data-np-name-orig="${i}" value="${esc(np.name_original)}" />
      </label>

      <div class="form-row">
        <label class="field">
          <span>Метка</span>
          <input type="text" data-np-label="${i}" value="${esc(np.label)}" placeholder="напр. 1" />
        </label>
        <label class="field">
          <span>Ранг</span>
          <input type="text" data-np-rank="${i}" value="${esc(np.rank)}" />
        </label>
      </div>

      <label class="field">
        <span>Тип</span>
        <input type="text" data-np-type="${i}" value="${esc(np.type)}" placeholder="Anti-Unit / Anti-Army…" />
      </label>

      <label class="field">
        <span>Эффект</span>
        <textarea data-np-effect="${i}" rows="3">${esc(np.effect)}</textarea>
      </label>
    </div>
  `).join('');

  // Класс
  const isStandard = STANDARD_CLASSES.includes(d.class);
  const selectedClass = isStandard ? d.class : (d.class ? EXTRA_CLASS_LABEL : '');
  const extraValue = isStandard ? '' : (d.class || '');
  const classOptions = ['<option value="">— выберите —</option>']
    .concat(STANDARD_CLASSES.map((c) => `<option value="${esc(c)}" ${selectedClass === c ? 'selected' : ''}>${esc(c)}</option>`))
    .concat(`<option value="${EXTRA_CLASS_LABEL}" ${selectedClass === EXTRA_CLASS_LABEL ? 'selected' : ''}>${EXTRA_CLASS_LABEL}</option>`)
    .join('');

  sec.innerHTML = `
    <form id="servantForm" autocomplete="off">
      <fieldset>
        <legend>Основное</legend>
        <label class="field">
          <span class="req">Имя</span>
          <input type="text" id="fName" value="${esc(d.name)}" required />
        </label>
        <label class="field">
          <span class="req">Класс</span>
          <select id="fClassSelect">${classOptions}</select>
        </label>
        <label class="field hidden" id="fClassExtraWrap">
          <span class="req">Название экстра-класса</span>
          <input type="text" id="fClassExtra" value="${esc(extraValue)}" placeholder="Эвейнджер / Руллер / Бист…" />
        </label>
        <label class="field">
          <span>Прозвища (через запятую)</span>
          <input type="text" id="fAliases" value="${esc(d.aliases.join(', '))}" placeholder="King of Heroes, Gil…" />
        </label>
        <label class="field">
          <span>Теги (через запятую)</span>
          <input type="text" id="fTags" value="${esc((d.tags || []).join(', '))}" placeholder="Святые, Франция, Меч…" />
        </label>
        <label class="field">
          <span>Мировоззрение (через запятую)</span>
          <input type="text" id="fAlignment" value="${esc(d.alignment.join(', '))}" placeholder="Lawful Good, Chaotic Evil…" />
        </label>
        <label class="field">
          <span>Натуральные враги (через запятую)</span>
          <input type="text" id="fEnemies" value="${esc(d.natural_enemy.join(', '))}" />
        </label>
        <label class="field">
          <span>Источник</span>
          <input type="text" id="fSource" value="${esc(d.source)}" placeholder="Мифология / история / серия" />
        </label>
      </fieldset>

      <fieldset>
        <legend>Внешность</legend>
        <label class="field">
          <span>Описание внешности</span>
          <textarea id="fAppearance" rows="4">${esc(d.appearance)}</textarea>
        </label>
      </fieldset>

      <fieldset>
        <legend>Биография</legend>
        <label class="field">
          <span>Биография</span>
          <textarea id="fBiography" rows="6">${esc(d.biography)}</textarea>
        </label>
      </fieldset>

      <fieldset>
        <legend>Параметры</legend>
        ${paramsHtml}
        <div class="hint">Переключатель «alt» включает альтер-форму параметра.</div>
      </fieldset>

      <fieldset>
        <legend>Навыки</legend>
        <div id="skillsList" style="display:flex;flex-direction:column;gap:10px;">${skillsHtml}</div>
        <button type="button" class="btn btn-ghost" id="addSkill" style="margin-top:10px;">+ добавить навык</button>
      </fieldset>

      <fieldset>
        <legend>Благородные Фантазмы</legend>
        <div id="npList" style="display:flex;flex-direction:column;gap:10px;">${npHtml}</div>
        <button type="button" class="btn btn-ghost" id="addNp" style="margin-top:10px;">+ добавить NP</button>
      </fieldset>

      <fieldset>
        <legend>Заметки</legend>
        <label class="field">
          <span>Заметки</span>
          <textarea id="fNotes" rows="4">${esc(d.notes)}</textarea>
        </label>
      </fieldset>

      <div class="form-actions">
        <button type="submit" class="btn btn-primary">Сохранить</button>
        <button type="button" class="btn btn-ghost" id="btnCancelForm">Отмена</button>
      </div>
      <div class="hint">Черновик автосохраняется в localStorage при вводе.</div>
    </form>
  `;

  bindFormEvents();
}

/* -------------------------- Динамические списки -------------------------- */
function renderSkillsList() {
  const d = state.formData;
  const wrap = $('#skillsList');
  wrap.innerHTML = d.skills.map((sk, i) => `
    <div class="dyn-item" data-skill-index="${i}">
      <div class="head">
        <span style="font-weight:700;color:var(--muted);font-size:.8rem;">Навык #${i + 1}</span>
        <div class="spacer"></div>
        <button type="button" class="btn btn-danger btn-icon" data-skill-remove="${i}" title="Удалить">✕</button>
      </div>
      
      <label class="field">
        <span>Название</span>
        <input type="text" data-skill-name="${i}" value="${esc(sk.name)}" />
      </label>

      <div class="form-row">
        <label class="field">
          <span>Тип</span>
          <select data-skill-kind="${i}">
            <option value="class" ${sk.kind === 'class' ? 'selected' : ''}>классовый</option>
            <option value="personal" ${sk.kind === 'personal' ? 'selected' : ''}>личный</option>
          </select>
        </label>
        <label class="field">
          <span>Ранг</span>
          <input type="text" data-skill-rank="${i}" value="${esc(sk.rank)}" placeholder="A / B+ / EX" />
        </label>
      </div>

      <label class="field">
        <span>Описание</span>
        <textarea data-skill-desc="${i}" rows="2">${esc(sk.description)}</textarea>
      </label>
    </div>
  `).join('');
  bindSkillEvents();
}

  const d = state.formData;
  const wrap = $('#npList');
  wrap.innerHTML = d.noble_phantasms.map((np, i) => `
    <div class="dyn-item" data-np-index="${i}">
      <div class="head">
        <span style="font-weight:700;color:var(--muted);font-size:.8rem;">NP #${i + 1}</span>
        <div class="spacer"></div>
        <button type="button" class="btn btn-danger btn-icon" data-np-remove="${i}" title="Удалить">✕</button>
      </div>

      <label class="field">
        <span>Название (рус)</span>
        <input type="text" data-np-name-ru="${i}" value="${esc(np.name_ru)}" />
      </label>
      <label class="field">
        <span>Название (оригинал)</span>
        <input type="text" data-np-name-orig="${i}" value="${esc(np.name_original)}" />
      </label>

      <div class="form-row">
        <label class="field">
          <span>Метка</span>
          <input type="text" data-np-label="${i}" value="${esc(np.label)}" placeholder="напр. 1" />
        </label>
        <label class="field">
          <span>Ранг</span>
          <input type="text" data-np-rank="${i}" value="${esc(np.rank)}" />
        </label>
      </div>

      <label class="field">
        <span>Тип</span>
        <input type="text" data-np-type="${i}" value="${esc(np.type)}" placeholder="Anti-Unit / Anti-Army…" />
      </label>

      <label class="field">
        <span>Эффект</span>
        <textarea data-np-effect="${i}" rows="3">${esc(np.effect)}</textarea>

  `).join('');

function bindSkillEvents() {
  const d = state.formData;
  $$('#skillsList [data-skill-kind]').forEach((el) => {
    el.addEventListener('change', () => {
      const i = +el.dataset.skillKind;
      d.skills[i].kind = el.value;
      saveDraft();
    });
  });
  ['name', 'rank', 'desc'].forEach((field) => {
    $$(`#skillsList [data-skill-${field}]`).forEach((el) => {
      el.addEventListener('input', () => {
        const i = +el.dataset['skill' + field.charAt(0).toUpperCase() + field.slice(1)];
        const keyMap = { name: 'name', rank: 'rank', desc: 'description' };
        d.skills[i][keyMap[field]] = el.value;
        saveDraft();
      });
    });
  });
  $$('#skillsList [data-skill-remove]').forEach((el) => {
    el.addEventListener('click', () => {
      d.skills.splice(+el.dataset.skillRemove, 1);
      renderSkillsList();
      saveDraft();
    });
  });
}

function bindNpEvents() {
  const d = state.formData;
  const map = {
    label: 'label', rank: 'rank', type: 'type', effect: 'effect',
    nameRu: 'name_ru', nameOrig: 'name_original',
  };
  Object.keys(map).forEach((attr) => {
    $$(`#npList [data-np-${attr.replace(/[A-Z]/g, (m) => '-' + m.toLowerCase())}]`).forEach((el) => {
      const datasetKey = Object.keys(el.dataset).find((k) => k.startsWith('np'));
      el.addEventListener('input', () => {
        const i = +el.dataset[datasetKey];
        d.noble_phantasms[i][map[attr]] = el.value;
        saveDraft();
      });
    });
  });
  $$('#npList [data-np-remove]').forEach((el) => {
    el.addEventListener('click', () => {
      d.noble_phantasms.splice(+el.dataset.npRemove, 1);
      renderNpList();
      saveDraft();
    });
  });
}

function bindFormEvents() {
  const d = state.formData;

  const classSelect = $('#fClassSelect');
  const extraWrap = $('#fClassExtraWrap');
  const extraInput = $('#fClassExtra');
  function syncExtraVisibility() {
    const isExtra = classSelect.value === EXTRA_CLASS_LABEL;
    extraWrap.classList.toggle('hidden', !isExtra);
  }
  syncExtraVisibility();
  classSelect.addEventListener('change', () => {
    if (classSelect.value === EXTRA_CLASS_LABEL) {
      d.class = extraInput.value.trim();
    } else {
      d.class = classSelect.value;
    }
    syncExtraVisibility();
    saveDraft();
  });
  extraInput.addEventListener('input', () => {
    if (classSelect.value === EXTRA_CLASS_LABEL) {
      d.class = extraInput.value.trim();
      saveDraft();
    }
  });

  const simpleBindings = [
    ['#fName', (v) => (d.name = v), (v) => v],
    ['#fAliases', (v) => (d.aliases = v.split(',').map((s) => s.trim()).filter(Boolean)), (v) => v],
    ['#fTags', (v) => (d.tags = v.split(',').map((s) => s.trim()).filter(Boolean)), (v) => v], // <-- ДОБАВЛЕНО
    ['#fAlignment', (v) => (d.alignment = v.split(',').map((s) => s.trim()).filter(Boolean)), (v) => v],
    ['#fEnemies', (v) => (d.natural_enemy = v.split(',').map((s) => s.trim()).filter(Boolean)), (v) => v],
    ['#fSource', (v) => (d.source = v), (v) => v],
    ['#fAppearance', (v) => (d.appearance = v), (v) => v],
    ['#fBiography', (v) => (d.biography = v), (v) => v],
    ['#fNotes', (v) => (d.notes = v), (v) => v],
  ];
  simpleBindings.forEach(([sel, setter]) => {
    const el = $(sel);
    if (!el) return;
    el.addEventListener('input', () => {
      setter(el.value);
      saveDraft();
    });
  });

  PARAM_KEYS.forEach(([k]) => {
    const baseInput = $(`[data-param-base="${k}"]`);
    const altInput = $(`[data-param-alt="${k}"]`);
    const altToggle = $(`[data-param-alt-toggle="${k}"]`);
    const altWrap = $(`[data-param-alt-wrap="${k}"]`);

    baseInput.addEventListener('input', () => {
      d.parameters[k].base = baseInput.value;
      saveDraft();
    });
    altInput.addEventListener('input', () => {
      d.parameters[k].alt = altInput.value;
      saveDraft();
    });
    altToggle.addEventListener('change', () => {
      if (altToggle.checked) {
        altWrap.style.display = '';
        d.parameters[k].alt = altInput.value || '';
      } else {
        altWrap.style.display = 'none';
        d.parameters[k].alt = null;
        altInput.value = '';
      }
      saveDraft();
    });
  });

  $('#addSkill').addEventListener('click', () => {
    d.skills.push({ kind: 'class', name: '', rank: '', description: '' });
    renderSkillsList();
    saveDraft();
  });
  $('#addNp').addEventListener('click', () => {
    d.noble_phantasms.push({ label: '', name_ru: '', name_original: '', type: '', rank: '', effect: '' });
    renderNpList();
    saveDraft();
  });

  bindSkillEvents();
  bindNpEvents();

  $('#btnCancelForm').addEventListener('click', async () => {
    const ok = await confirmDialog('Выйти без сохранения? Черновик останется.', 'Выйти');
    if (!ok) return;
    if (state.currentId) {
      openDetail(state.currentId);
    } else {
      renderList();
      showScreen('list');
    }
  });

  $('#servantForm').addEventListener('submit', async (e) => {
    e.preventDefault();
    d.name = $('#fName').value.trim();
    if (classSelect.value === EXTRA_CLASS_LABEL) {
      d.class = extraInput.value.trim();
    } else {
      d.class = classSelect.value;
    }
    if (!d.name) { toast('Укажите имя'); $('#fName').focus(); return; }
    if (!d.class) {
      toast(classSelect.value === EXTRA_CLASS_LABEL ? 'Укажите название экстра-класса' : 'Выберите класс');
      return;
    }
    const toSave = normalizeServant(d);
    if (state.currentId) toSave.id = state.currentId;
    await dbPut(toSave);
    clearDraft();
    state.draftChecked = true;
    await refreshAll();
    fillFilters();
    renderList();
    showScreen('list');
    toast('Сохранено');
  });
}

/* -------------------------- Дублирование -------------------------- */
async function duplicateServant(s) {
  const copy = normalizeServant(s);
  copy.id = genId();
  copy.name = (copy.name || 'Без имени') + ' (копия)';
  await dbPut(copy);
  await refreshAll();
  fillFilters();
  renderList();
  toast('Слуга дублирован');
  openDetail(copy.id);
}

/* -------------------------- Экспорт / импорт -------------------------- */
async function exportJSON() {
  await refreshAll();
  const blob = new Blob([JSON.stringify(state.all, null, 2)], { type: 'application/json' });
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url;
  a.download = 'servants.json';
  document.body.appendChild(a);
  a.click();
  a.remove();
  URL.revokeObjectURL(url);
  toast('Экспортировано: servants.json');
}

async function handleImportFile(e) {
  const file = e.target.files && e.target.files[0];
  e.target.value = '';
  if (!file) return;
  let data;
  try {
    const text = await file.text();
    data = JSON.parse(text);
  } catch (err) {
    toast('Ошибка: файл не является корректным JSON');
    return;
  }
  if (!Array.isArray(data)) {
    toast('Ошибка: ожидался массив слуг');
    return;
  }
  const existing = await dbGetAll();
  const usedIds = new Set(existing.map((x) => x.id));
  const normalized = data.map((raw) => {
    const s = normalizeServant(raw);
    while (usedIds.has(s.id)) s.id = genId();
    usedIds.add(s.id);
    return s;
  });

  const replace = await confirmDialog(
    `Импортировано записей: ${normalized.length}. Заменить базу или добавить к существующим?`,
    'Заменить'
  );
  if (replace) {
    await dbClear();
    await dbBulkPut(normalized);
    toast('База заменена');
  } else {
    await dbBulkPut(normalized);
    toast('Добавлено к существующим');
  }
  await refreshAll();
  fillFilters();
  renderList();
  showScreen('list');
}

/* -------------------------- Инициализация -------------------------- */
async function init() {
  $('#fabAdd').addEventListener('click', () => {
    state.draftChecked = false;
    openForm(null);
  });
  $('#searchInput').addEventListener('input', renderList);
  $('#filterClass').addEventListener('change', renderList);
  $('#filterSource').addEventListener('change', renderList);
  $('#filterTag').addEventListener('change', renderList);
  $('#topExport').addEventListener('click', exportJSON);
  $('#topImport').addEventListener('click', () => $('#topImportFile').click());
  $('#topImportFile').addEventListener('change', handleImportFile);

  initColorSettings();

  const classModal = $('#classModal');
  if (classModal) {
    $('#classModalClose').addEventListener('click', () => classModal.style.display = 'none');
    classModal.addEventListener('click', (e) => {
      if (e.target === classModal) classModal.style.display = 'none';
    });
  }

  await refreshAll();
  fillFilters();
  renderList();
  showScreen('list');

  if ('serviceWorker' in navigator) {
    try {
      await navigator.serviceWorker.register('service-worker.js');
    } catch (e) {
      console.warn('SW registration failed', e);
    }
  }
}

init();

if (!('indexedDB' in window)) {
  document.body.innerHTML = '<p style="padding:20px;color:#e05252">Ваш браузер не поддерживает IndexedDB.</p>';
}
</script>
